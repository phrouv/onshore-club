    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3306:5432" # LOCALHOST ONLY
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: onshore_planning_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - onshore

  # ========== CREDIT DB ==========
  creditdb:
    image: postgres:18-alpine
    container_name: creditdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3307:5432" # LOCALHOST ONLY
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: onshore_credit_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
