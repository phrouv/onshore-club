      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      partnerdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "partner-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://partnerdb:5432/onshore_partner_db"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - onshore

  # ========== BOOKING SERVICE ==========
  booking-service:
    image: "onshore/onshore-booking:1.0.0"
    container_name: onshore-booking-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
