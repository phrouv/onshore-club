# =============================================================================
# Airline Microservices — Docker Compose
# =============================================================================
# ONLY API GATEWAY (Port 5000) is exposed externally
# All other services are internal only
# =============================================================================

services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # ========== USER DB ==========
  userdb:
    image: postgres:18-alpine
    container_name: userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3302:5432" # LOCALHOST ONLY - for debugging if needed
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: onshore_user_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - onshore

  # ========== PAYMENT DB ==========
  paymentdb:
    image: postgres:18-alpine
    container_name: paymentdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3303:5432" # LOCALHOST ONLY
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: onshore_payment_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - onshore

  # ========== BOOKING DB ==========
  bookingdb:
    image: postgres:18-alpine
    container_name: bookingdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3305:5432" # LOCALHOST ONLY
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: onshore_booking_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - onshore

  # ========== PARTNER DB ==========
  partnerdb:
    image: postgres:18-alpine
    container_name: partnerdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3304:5432" # LOCALHOST ONLY
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: onshore_partner_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
