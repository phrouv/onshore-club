    environment:
      SPRING_APPLICATION_NAME: "credit-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://creditdb:5432/onshore_credit_db"
      SPRING_DATASOURCE_USERNAME: postgres
