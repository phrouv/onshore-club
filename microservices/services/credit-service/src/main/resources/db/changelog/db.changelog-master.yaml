databaseChangeLog:
  - changeSet:
      id: 001-create-plans-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: plans
      changes:
        - createTable:
            tableName: plans
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_plans
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: monthly_price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: credits_per_month
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: positioning
                  type: VARCHAR(255)
                  defaultValue: ''
                  constraints:
                    nullable: false
              - column:
                  name: popular
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 001-create-credit_settings-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: credit_settings
      changes:
        - createTable:
            tableName: credit_settings
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_settings
                    nullable: false
              - column:
                  name: credits_low
                  type: INTEGER
                  defaultValueNumeric: 4
                  constraints:
                    nullable: false
              - column:
                  name: credits_normal
                  type: INTEGER
                  defaultValueNumeric: 5
                  constraints:
                    nullable: false
              - column:
                  name: credits_high
                  type: INTEGER
                  defaultValueNumeric: 7
                  constraints:
                    nullable: false
              - column:
                  name: default_payout
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 5.00
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 001-create-subscriptions-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: subscriptions
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subscriptions
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: plan_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: plan_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: monthly_price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: credits_per_month
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-credit_transactions-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: credit_transactions
      changes:
        - createTable:
            tableName: credit_transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_transactions
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price_paid
                  type: NUMERIC(10,2)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-credit_accounts-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: credit_accounts
      changes:
        - createTable:
            tableName: credit_accounts
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_accounts
                    nullable: false
              - column:
                  name: balance
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

