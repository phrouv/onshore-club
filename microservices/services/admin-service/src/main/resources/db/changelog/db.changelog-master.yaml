databaseChangeLog:
  - changeSet:
      id: 001-create-usage-rules-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: usage_rules
      changes:
        - createTable:
            tableName: usage_rules
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_usage_rules
                    nullable: false
              - column:
                  name: scope
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: partner_id
                  type: UUID
              - column:
                  name: activity_id
                  type: UUID
              - column:
                  name: max_uses
                  type: INTEGER
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITHOUT TIME ZONE

  - changeSet:
      id: 002-create-app-settings-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: app_settings
      changes:
        - createTable:
            tableName: app_settings
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_settings
                    nullable: false
              - column:
                  name: checkin_before_minutes
                  type: INTEGER
                  defaultValueNumeric: 30
                  constraints:
                    nullable: false
              - column:
                  name: checkin_after_minutes
                  type: INTEGER
                  defaultValueNumeric: 15
                  constraints:
                    nullable: false
              - column:
                  name: cancellation_hours
                  type: INTEGER
                  defaultValueNumeric: 12
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITHOUT TIME ZONE

  - changeSet:
      id: 003-create-categories-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_category_code
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITHOUT TIME ZONE

  - changeSet:
      id: 004-seed-app-settings
      author: onshore
      changes:
        - insert:
            tableName: app_settings
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()

  - changeSet:
      id: 005-seed-default-usage-rule
      author: onshore
      changes:
        - insert:
            tableName: usage_rules
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: scope
                  value: SESSIONS_PER_DAY
              - column:
                  name: active
                  valueBoolean: true
