eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: admin-service
  config:
    import: optional:configserver:http://localhost:8888

com:
  onshore:
    storage:
      endpoint: http://localhost:9000
      region: us-east-1
      public-base-url: http://localhost:9000/onshorebucket
      bucket-name: onshorebucket
      access-key: onshore
      secret-key: onshore-secret

info:
  app:
    name: ${spring.application.name}
    description: "Admin rules (usage limits, check-in and cancellation settings) and global dashboard."
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
