databaseChangeLog:
  - changeSet:
      id: 001-create-partners-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: partners
      changes:
        - createTable:
            tableName: partners
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_partners
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: category
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: latitude
                  type: DOUBLE PRECISION
              - column:
                  name: longitude
                  type: DOUBLE PRECISION
              - column:
                  name: phone
                  type: VARCHAR(255)
              - column:
                  name: professional_email
                  type: VARCHAR(255)
              - column:
                  name: website
                  type: VARCHAR(255)
              - column:
                  name: instagram
                  type: VARCHAR(255)
              - column:
                  name: activity_types
                  type: TEXT
              - column:
                  name: desired_seats
                  type: VARCHAR(255)
              - column:
                  name: manager_first_name
                  type: VARCHAR(255)
              - column:
                  name: manager_last_name
                  type: VARCHAR(255)
              - column:
                  name: manager_role
                  type: VARCHAR(255)
              - column:
                  name: owner_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-activities-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: activities
      changes:
        - createTable:
            tableName: activities
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_activities
                    nullable: false
              - column:
                  name: partner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: duration_minutes
                  type: INTEGER
                  defaultValueNumeric: 60
                  constraints:
                    nullable: false
              - column:
                  name: partner_payout
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 5.00
                  constraints:
                    nullable: false
              - column:
                  name: default_credits
                  type: INTEGER
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
