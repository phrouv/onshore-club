databaseChangeLog:
  - changeSet:
      id: 001-create-partners-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: partners
      changes:
        - createTable:
            tableName: partners
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_partners
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_partner_name
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: partner_street
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: partner_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: partner_zip_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: website
                  type: VARCHAR(500)
              - column:
                  name: instagram
                  type: VARCHAR(500)
              - column:
                  name: manager_first_name
                  type: VARCHAR(100)
              - column:
                  name: manager_last_name
                  type: VARCHAR(100)
              - column:
                  name: manager_email
                  type: VARCHAR(500)
              - column:
                  name: manager_phone_number
                  type: VARCHAR(100)
              - column:
                  name: owner_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITHOUT TIME ZONE

  - changeSet:
      id: 002-create-activities-table
      author: onshore
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: activities
      changes:
        - createTable:
            tableName: activities
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_activities
                    nullable: false
              - column:
                  name: partner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: duration_minutes
                  type: INTEGER
                  defaultValueNumeric: 60
                  constraints:
                    nullable: false
              - column:
                  name: partner_payout
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 5.00
                  constraints:
                    nullable: false
              - column:
                  name: default_credits
                  type: INTEGER
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
